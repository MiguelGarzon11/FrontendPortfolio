<div
  class="w-full h-full shrink-0 col-span-1 row-span-1 flex flex-col bg-button/20 dark:bg-button-s/20 rounded-b-3xl rounded-t-2xl drop-shadow-lg drop-shadow-button dark:drop-shadow-stone-800 p-5 sm:p-10 justify-center gap-3">
  <h1 class="text-2xl text-button-s dark:text-button text-start text-nowrap font-mono font-extrabold">
    {{ title }}
  </h1>
  <p class="font-extralight text-sm dark:text-stone-200 text-stone-800 h-38">{{ description }}</p>
  <div class="flex flex-wrap w-full justify-center items-end gap-3 my-2">
    @for (icon of icons; track icon) {
      <svg class="w-14 h-14 sm:w-15 sm:h-15 hover:scale-105 hover:cursor-pointer transition-all duration-300">
          <use [attr.href]="'/assets/icons/skills/' + icon + '.svg'"></use>
      </svg>
    }
  </div>
  @if (title == 'Android' || title == 'Tools') {
    <hr class="my-2 shrink-0">
  }
  <div class="w-full h-full group">
    <div class="absolute top-5 right-5 w-8 h-8">
      <button
        class="w-full h-full flex justify-center items-center rounded-full bg-transparent hover:bg-main/10 dark:hover:bg-secondary/5 cursor-pointer"
      >
        <svg
          class="w-7 h-7 text-button-s/70 hover:text-button-s dark:text-secondary/70 dark:hover:text-secondary"
        >
          <use href="assets/icons/info.svg" />
        </svg>
      </button>
    </div>
    <div
      class="opacity-0 hidden group-hover:opacity-100 group-active:opacity-100 absolute bg-main/50 dark:bg-secondary/50 px-5 w-auto h-auto py-2 top-2.5 right-14 rounded-2xl group-hover:flex items-center z-10 backdrop-blur-xl"
    >
      <p class="font-extralight text-sm text-secondary dark:text-main">
        Tap for more information.
      </p>
    </div>
  </div>
</div>
